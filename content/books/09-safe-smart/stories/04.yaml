id: safe-smart-04
question: Why do we wear a helmet?
answer: A helmet is a hard hat for your head. If you fall, it helps keep your brain safe. We wear one
  for bikes, scooters and skates.
lets_try: Put on a pretend helmet. Click the strap under your chin. Now you are ready to ride!
talk_about: What do we wear on our head to ride a bike?
grown_up_corner: Helmets work best when snug and level on the head, with the straps fastened. When you
  wear one too, children are more likely to follow.
