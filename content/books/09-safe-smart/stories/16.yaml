id: safe-smart-16
question: Why can I say 'Stop!' when I do not like something?
answer: Our body belongs to us. If something feels wrong, we can say 'Stop!' or 'No!' Grown-ups and friends
  must listen and stop.
lets_try: '{Practice|Practise} saying ''Stop!'' in a strong, clear voice. Then say, ''Thank you for listening.'''
talk_about: What can you say if you do not want a tickle or a hug?
grown_up_corner: Teach correct names for body parts, and that no one should ask a child to keep secrets
  about their body. Respect your child's 'no' to hugs, and offer a wave or a high five instead.
