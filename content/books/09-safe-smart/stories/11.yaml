id: safe-smart-11
question: Why do we not play with sharp things?
answer: Scissors, knives and pins are very sharp. They are great tools, but they can cut us. Only grown-ups
  use sharp things, until we are old enough to learn.
lets_try: With a grown-up, find the safe places where sharp things live, like a high drawer. Say 'Grown-ups
  only!'
talk_about: What can we use that is safe and not sharp?
grown_up_corner: 'Store sharp items out of reach. When your child is ready, offer child-safe scissors
  and supervise them. Show the safe way to carry scissors: closed, with the points down.'
