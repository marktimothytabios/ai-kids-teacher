id: safe-smart-02
question: Why do we wait for the green man?
answer: The traffic light tells cars and people when to go. Red means stop and wait. Green means it is
  safe to cross, and we still look and listen first.
lets_try: Play 'Red light, green light' with a friend. Freeze on red. Walk on green.
talk_about: What does the red light say? What does the green light say?
grown_up_corner: Teach 'stop, look, listen, then walk, holding hands'. Even on green, drivers can make
  mistakes, so keep holding hands until you are all the way across.
