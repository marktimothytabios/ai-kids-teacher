id: safe-smart-20
question: Why do we have rules?
answer: Rules help everyone to be safe and kind. Rules like 'walk inside' and 'be gentle' keep us from
  getting hurt. When we all follow the rules, everyone has fun!
lets_try: Make a rule for your game. What is it? Can everyone follow it?
talk_about: What is a rule that keeps you safe?
grown_up_corner: 'Explain the reason behind each rule, keep rules few and clear, and say what to do rather
  than what not to do: ''Walk, please'' works better than ''Don''t run.'''
