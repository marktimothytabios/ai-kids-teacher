id: safe-smart-17
question: Why do we ask before we take something?
answer: Things belong to people. If we take something without asking, our friend may feel sad or cross.
  When we ask first, our friend can say yes.
lets_try: Ask a friend, 'May I have a turn with that?' Say 'Thank you' if they say yes.
talk_about: What can you do if the answer is no?
grown_up_corner: Toddlers see everything as theirs, so it takes time to learn about owning. Give them
  words to ask and a way to wait, and keep their special toys safe from visitors.
