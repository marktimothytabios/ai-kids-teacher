id: safe-smart-15
question: Why do we tell a grown-up when we are hurt or scared?
answer: Grown-ups can help when we are hurt or scared. Telling them keeps us safe. We are never in trouble
  for telling.
lets_try: '{Practice|Practise} saying, ''I need help.'' Tell your teddy about something that scared you.'
talk_about: Who can you tell if you feel scared?
grown_up_corner: Make it clear that your child will never be in trouble for telling you something, and
  respond calmly and with thanks. This is the foundation of keeping children safe.
