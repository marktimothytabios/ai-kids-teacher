id: safe-smart-01
question: Why do we hold hands near the road?
answer: Cars are big and fast, and drivers might not see little people. Holding a grown-up's hand keeps
  you safe. We stop, look and listen before we cross.
lets_try: Play stop and go! Red means stop. Green means go!
talk_about: What do we do before we cross the road?
grown_up_corner: Toddlers cannot judge speed or distance, so a hand-hold is the rule near roads and car
  parks. {Practice|Practise} 'stop, look and listen' at every crossing, and model it yourself.
