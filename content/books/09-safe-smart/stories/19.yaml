id: safe-smart-19
question: Why do we keep promises?
answer: A promise is a word we give to someone. If we say we will do it, we should try our best. When
  we keep promises, people trust us.
lets_try: Make a small promise, like 'I promise to put my shoes away.' Then do it!
talk_about: What is a promise you can keep today?
grown_up_corner: Keep your own promises to your child, too, because this builds trust more than any lecture.
  Small, achievable promises are best.
