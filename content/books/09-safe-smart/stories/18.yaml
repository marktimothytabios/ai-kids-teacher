id: safe-smart-18
question: Why do we tell the truth?
answer: Telling the truth means saying what really happened. When we tell the truth, people can trust
  us. Even when we make a mistake, the truth helps us fix it.
lets_try: Pretend your teddy spilled the milk. Say, 'I did it. I will help to clean up.'
talk_about: What happens if we tell the truth after an accident?
grown_up_corner: Thank your child for telling the truth, even when you are not happy about what happened.
  Punishing honesty teaches children to hide things.
