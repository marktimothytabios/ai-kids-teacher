id: safe-smart-09
question: Why do we not touch hot things?
answer: Hot things can burn our skin, and burns hurt a lot. Stoves, ovens, kettles and heaters can be
  hot. When we see something hot, we say, 'Hot! Do not touch!'
lets_try: Say 'Hot! Do not touch!' in a funny voice. Point to things that are hot in your kitchen, from
  a distance.
talk_about: What things at home are hot?
grown_up_corner: Keep hot drinks and pans out of reach, and turn pan handles inward. Teach the word 'hot'
  early. If a burn does happen, cool it under cool running water for 20 minutes and seek help.
