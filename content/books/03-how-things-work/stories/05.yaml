id: how-things-work-05
question: Why do things fall down?
answer: The Earth pulls everything towards it. This pull is called gravity. That's why apples fall down
  from trees, and why your spoon drops to the floor!
lets_try: Drop a soft toy. Did it fall up or down?
talk_about: What happens when you drop a feather and a spoon?
grown_up_corner: Gravity pulls everything toward the {center|centre} of the Earth. A feather falls slowly
  because air slows it down. That is why a parachute works.
