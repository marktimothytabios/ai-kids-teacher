id: how-things-work-01
question: Why do cars have wheels?
answer: Wheels are round, so they roll! Rolling is much easier than sliding. Wheels help cars, buses,
  bikes and prams go along smoothly.
lets_try: Roll a ball and push a block. Which one goes further?
talk_about: What things do you know that have wheels?
grown_up_corner: A round wheel keeps rolling with very little rubbing, so it takes much less effort than
  sliding. Let your child roll a ball, a toy car and a block, and see which one rolls best.
