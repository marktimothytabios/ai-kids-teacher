id: how-things-work-10
question: Why do boats float?
answer: Boats are shaped to push lots of water out of the way. The water pushes back up and holds the
  boat up high. That's why even big boats don't sink!
lets_try: Make a little boat out of foil and float it in the bath!
talk_about: What would you carry on a boat?
grown_up_corner: A boat pushes water out of the way, and the water pushes back up. A wide boat shape spreads
  the weight so it floats. Float and sink games in the bath are the best science lab.
