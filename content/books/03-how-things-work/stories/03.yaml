id: how-things-work-03
question: Why does a seesaw go up and down?
answer: A seesaw is a long board that balances in the middle. When one child sits on one end, that end
  goes down and the other end goes up. Two friends can take turns pushing.
lets_try: Sit across from a friend. Gently push the ground with your feet to make a seesaw, or rock side
  to side.
talk_about: What happens if one friend is much heavier?
grown_up_corner: A seesaw is a lever. It balances when the weights on each side are equal, or when the
  heavier child sits closer to the middle. Great for talking about heavy and light.
