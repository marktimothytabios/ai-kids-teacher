id: how-things-work-14
question: Why are there waves?
answer: The wind blows across the sea and pushes the water into bumps. The bumps roll along and splash
  onto the beach. Whoosh, splash!
lets_try: Make waves in the bath with your hands. Whoosh!
talk_about: How do the waves look? Fast or slow?
grown_up_corner: Wind blowing over the surface pushes the water and creates ripples that grow into waves.
  The moon's pull also moves the sea in and out, which makes the tides.
