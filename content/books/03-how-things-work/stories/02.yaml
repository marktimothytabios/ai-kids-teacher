id: how-things-work-02
question: Why do bikes have pedals?
answer: When we push the pedals, they turn a chain. The chain turns the back wheel, and off we go! Our
  legs make the bike move.
lets_try: Lie on your back and pedal your legs in the air like you are riding a bike.
talk_about: Where would you like to go on a bike?
grown_up_corner: Pedals, chain and gears turn leg power into wheel power. Always add a helmet for any
  ride, even on a tricycle or a balance bike.
