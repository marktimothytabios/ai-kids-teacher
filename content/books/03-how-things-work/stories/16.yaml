id: how-things-work-16
question: Why can I see myself in a mirror?
answer: A mirror is a very smooth, shiny piece of glass. Light bounces off you and hits the mirror. Then
  it bounces back to your eyes, and you see yourself!
lets_try: Look in a mirror and make a silly face. Wave to your friend in the mirror!
talk_about: What do you see when you smile?
grown_up_corner: We see things because light bounces off them into our eyes. A mirror reflects almost
  all of the light back in an orderly way, so we see a sharp picture. Left and right look swapped.
