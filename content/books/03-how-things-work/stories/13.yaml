id: how-things-work-13
question: Why is the sea salty?
answer: Rain washes teeny bits of salt from rocks into rivers. The rivers carry the salt all the way to
  the sea. The salt stays there, so the sea tastes salty!
lets_try: Taste a tiny pinch of salt with a grown-up. Is it salty? Yuck or yum?
talk_about: Have you ever tasted salty water? What did it taste like?
grown_up_corner: Rivers carry tiny bits of salt and minerals from rocks into the ocean. When seawater
  evaporates, the salt stays behind. The sea has been collecting salt for millions of years.
