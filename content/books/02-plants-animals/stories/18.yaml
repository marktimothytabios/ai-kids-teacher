question: Why does a giraffe have a long neck?
answer: A giraffe's long neck helps it reach tall trees. It eats leaves from the very top branches. Other
  animals cannot reach those yummy leaves!
lets_try: Stand tall and stretch up to reach something high. Now stretch like a giraffe!
talk_about: What can you reach when you stand on tiptoe?
grown_up_corner: A giraffe can be over five {meters|metres} tall and has the same number of neck bones
  as we do, only much longer. Giraffes also have very long blue-black tongues for grabbing leaves.
