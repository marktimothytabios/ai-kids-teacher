id: plants-animals-16
question: Why do fish live in water?
answer: Fish breathe water instead of air. They have special parts called gills that take the air out
  of the water. Their fins and tails help them swim.
lets_try: Make fish lips! Now swim your hand like a little fish.
talk_about: What do you think fish like to eat?
grown_up_corner: Fish take oxygen from the water with their gills. If a fish leaves the water, its gills
  cannot work, so it cannot breathe. Visit a pond or aquarium together.
