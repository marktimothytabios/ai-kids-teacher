id: plants-animals-01
question: Why do seeds grow into plants?
answer: A seed is a tiny baby plant with its own packed lunch. When it gets water and warmth, it wakes
  up. A little root goes down and a little shoot goes up!
lets_try: Put a bean seed on a damp paper towel in a clear cup. Look at it every day.
talk_about: What do you think the seed needs to grow?
grown_up_corner: Seeds hold a tiny plant and stored food. Water softens the seed coat, and the root grows
  first. Beans sprout in about a week on a warm windowsill.
