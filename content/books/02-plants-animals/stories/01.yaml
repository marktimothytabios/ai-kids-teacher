id: plants-animals-01
question: Why do flowers smell nice?
answer: Flowers smell sweet to say 'Come here!' to bees and butterflies. The bees visit the flowers and
  help them make seeds, so more flowers can grow.
lets_try: Smell a flower very gently. Sniff, sniff! Does it smell sweet?
