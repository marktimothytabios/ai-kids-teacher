id: plants-animals-05
question: Why does a caterpillar turn into a butterfly?
answer: A caterpillar eats and eats and grows big. Then it wraps up in a safe case called a chrysalis.
  Inside, it slowly changes into a butterfly with wings!
lets_try: Crouch down and crawl like a caterpillar. Curl up small. Now flutter your arms like wings!
talk_about: What do you think the caterpillar eats?
grown_up_corner: This change is called metamorphosis. The caterpillar eats leaves, then its body rebuilds
  itself inside the chrysalis. It takes about two weeks. Library books and local butterfly houses are
  a good follow-up.
