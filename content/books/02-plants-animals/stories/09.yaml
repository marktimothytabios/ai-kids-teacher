id: plants-animals-09
question: Why do ducks float?
answer: Ducks have feathers with a special oil that keeps the water out. Air gets trapped under their
  feathers, like a little life jacket. So they float on top of the water. Quack!
lets_try: At bath time, test some toys. Which ones float? Which ones sink?
