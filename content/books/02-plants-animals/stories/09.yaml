id: plants-animals-09
question: Why do dogs wag their tails?
answer: Dogs can't talk with words, so they talk with their tails! A happy wag means 'I'm happy to see
  you!' Always ask a grown-up before patting a dog.
lets_try: Can you wiggle like a happy dog? Woof, woof!
talk_about: How do you show someone you are happy?
grown_up_corner: Dogs also use their ears, faces and bodies to talk. A loose, wiggly body and wagging
  tail usually mean friendly. Teach children to ask before petting any dog and to pet gently.
