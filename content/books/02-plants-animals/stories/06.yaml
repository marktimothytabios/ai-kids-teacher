id: plants-animals-06
question: Why do worms live in the soil?
answer: Worms like it dark, damp and cool. They wriggle through the soil and eat dead leaves. Their tunnels
  help air and water get to the plant roots.
lets_try: After rain, look for worms in the garden with a grown-up. Watch them wriggle, then put them
  back gently.
talk_about: How does a worm move without any legs?
grown_up_corner: Worms breathe through their skin, which must stay damp. Their droppings feed the soil.
  Sunshine and dry paths can hurt them, so help any worm on a path back to soil.
