id: plants-animals-06
question: Why do dogs wag their tails?
answer: Dogs can't talk with words, so they talk with their tails! A happy wag means 'I'm happy to see
  you!' Always ask a grown-up before patting a dog.
lets_try: Can you wiggle like a happy dog? Woof, woof!
