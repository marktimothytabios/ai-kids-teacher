question: Why do bees buzz?
answer: 'bzzz! Bees flap their little wings super, super fast. So fast that it makes a sound: bzzzzz!
  Bees are busy helpers. They visit flowers and make yummy honey.'
lets_try: Flap your arms super fast and say 'Bzzzzz!'
