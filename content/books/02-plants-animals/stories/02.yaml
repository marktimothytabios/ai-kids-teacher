id: plants-animals-02
question: Why do plants need water?
answer: Plants get thirsty, just like you! Their roots drink water from the soil. Water, sunshine and
  air help plants grow big and strong.
lets_try: Help a grown-up water a plant. Not too much - just a little drink!
talk_about: Which plants at home or outside need a drink today?
grown_up_corner: Roots soak up water and food from the soil and carry them up the plant. Plants also use
  sunlight and air to make their own food. Let your child do the watering with a small cup.
