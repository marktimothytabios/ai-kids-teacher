id: plants-animals-13
question: Why can birds fly?
answer: Birds have wings and very light bodies. When they flap their wings, they push the air down, and
  that lifts them up into the sky! Their feathers help them glide.
lets_try: Stretch your arms out like wings. Flap, flap - fly around the room!
talk_about: How do you move your arms like a bird?
grown_up_corner: Birds have hollow bones and feathers, so they weigh very little. Their wings push air
  down and backward to lift them up and forward. Not every bird flies; penguins swim and ostriches run.
