id: plants-animals-11
question: Why do cows say moo?
answer: Cows moo to talk to each other. A mama cow moos to call her calf. Cows also moo when they are
  hungry or when they want to find their friends.
lets_try: Moo like a mama cow. Now moo like a little calf. Can you tell them apart?
talk_about: Which animal sounds can you make?
grown_up_corner: Cows have different moos for different jobs, and calves learn to know their mother's
  voice. Cows give us milk, and it is a good moment to talk about where food comes from.
