id: plants-animals-04
question: Why do bees buzz?
answer: 'bzzz! Bees flap their little wings super, super fast. So fast that it makes a sound: bzzzzz!
  Bees are busy helpers. They visit flowers and make yummy honey.'
lets_try: Flap your arms super fast and say 'Bzzzzz!'
talk_about: What other animals make a buzzing sound?
grown_up_corner: Bees beat their wings about 200 times every second, which makes the buzz. Bees help us
  because they carry pollen between flowers. Teach children to give bees space and not to swat them.
