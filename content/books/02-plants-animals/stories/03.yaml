id: plants-animals-03
question: Why do flowers smell nice?
answer: Flowers smell sweet to say 'Come here!' to bees and butterflies. The bees visit the flowers and
  help them make seeds, so more flowers can grow.
lets_try: Smell a flower very gently. Sniff, sniff! Does it smell sweet?
talk_about: What is the nicest smell you know?
grown_up_corner: Flowers make sweet-smelling scents and bright {colors|colours} to attract bees and butterflies.
  The insects carry pollen from flower to flower, which helps new seeds to form.
