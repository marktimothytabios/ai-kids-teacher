id: plants-animals-03
question: Why do plants need water?
answer: Plants get thirsty, just like you! Their roots drink water from the soil. Water, sunshine and
  air help plants grow big and strong.
lets_try: Help a grown-up water a plant. Not too much - just a little drink!
