question: Why do kangaroos hop?
answer: Kangaroos have big, strong back legs and a long tail to help them balance. Hopping helps them
  go far and fast without getting tired. Boing, boing, boing!
lets_try: Hop like a kangaroo! How many hops can you do?
talk_about: Can you hop like a kangaroo? How far can you jump?
grown_up_corner: A kangaroo's strong back legs work like springs, and its tail helps it balance. Baby
  kangaroos called joeys grow in a pouch on their mother's tummy.
