question: Why do cats purr?
answer: 'purrr... Cats purr when they feel {cozy|cosy} and happy. It''s a soft, rumbly sound, like a tiny
  motor: purrrrr. It''s a cat''s way of saying ''I feel good!'''
lets_try: Can you purr like a cat? Purrrrr... meow!
talk_about: What other things make you feel {cozy|cosy}?
grown_up_corner: Cats purr when they are content, and sometimes also when they are hurt or scared, to
  calm themselves. A purr comes from the muscles in the cat's throat.
