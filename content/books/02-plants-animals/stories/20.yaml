question: Why do bears sleep in winter?
answer: In winter, it is cold and there is less food. Some bears eat lots in autumn and then have a long,
  {cozy|cosy} sleep in a den. They wake up in spring, hungry!
lets_try: Curl up like a sleepy bear under a blanket. Then wake up and stretch with a big yawn.
talk_about: What would you eat before a long sleep?
grown_up_corner: This long rest is called hibernation or winter sleep. A bear's body slows down and uses
  stored fat. Mother bears often have their cubs while they are in the den.
