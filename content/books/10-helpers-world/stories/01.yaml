question: Why do grown-ups go to work?
answer: Grown-ups go to work to help other people, and to earn money for food and our home. Some build
  houses, some help sick people, and some grow food. What job would you like to do?
lets_try: Pretend to be a builder, a doctor or a chef! What do you do?
