id: helpers-world-15
question: Why do we turn off the lights?
answer: Lights use electricity. When we turn them off, we save energy. It helps the Earth, and it saves
  money, too.
lets_try: Be a light detective. Find a light that nobody is using and switch it off.
talk_about: When can we turn off the lights?
grown_up_corner: Energy saving can be a daily habit. Praise your child when they notice, and talk about
  how daylight, switches and sun are all kinds of energy.
