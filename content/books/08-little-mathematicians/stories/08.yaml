id: little-mathematicians-08
question: Why are some things tall and some short?
answer: Tall means a long way up. Short means not so far up. A giraffe is tall, a bunny is short, and
  you are growing taller every day!
lets_try: Stand on tiptoe to be tall. Now crouch down to be short. Stand back to back with a friend. Who
  is taller?
talk_about: What is the tallest thing you can see?
grown_up_corner: Measure your child against a wall once in a while and mark the height. Looking back at
  old marks makes growth and measurement real.
