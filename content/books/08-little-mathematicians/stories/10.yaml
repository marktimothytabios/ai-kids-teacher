id: little-mathematicians-10
question: Why do we measure things?
answer: Measuring tells us how long, how tall or how much. We can measure with rulers, cups or even our
  hands! Then we can share the answer with everyone.
lets_try: Measure the table with your hands. How many hands long is it? Now measure with a ruler.
talk_about: What would you like to measure?
grown_up_corner: Start with non-standard units like hand spans, steps or blocks, and let children discover
  why a ruler gives the same answer for everyone.
