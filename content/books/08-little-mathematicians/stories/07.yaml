id: little-mathematicians-07
question: Why are some things big and some small?
answer: Things come in lots of sizes. An elephant is big, a mouse is small, and you are in between. We
  can compare to see which is bigger.
lets_try: Find the biggest thing and the smallest thing in the room. Line up three toys from small to
  big.
talk_about: What is the biggest animal you can think of? The smallest?
grown_up_corner: 'Size words are always about comparison: big compared to what? Use ''bigger'', ''smaller'',
  ''biggest'' and ''smallest'' as your child plays.'
