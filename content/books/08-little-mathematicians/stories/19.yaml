id: little-mathematicians-19
question: Why do we need a clock?
answer: A clock tells us what time it is. It helps us know when to wake up, eat, play and sleep. The short
  hand tells the hour and the long hand tells the minutes.
lets_try: Look at a clock at breakfast time, lunch time and bedtime. Where are the hands?
talk_about: What time do you wake up? What do you do at that time?
grown_up_corner: 'Toddlers do not tell time yet, but they can link times with routines: ''When the hands
  are here, it is bedtime.'' Use first, then and later in daily talk.'
