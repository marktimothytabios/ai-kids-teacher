id: feelings-friends-05
question: Why do we take deep breaths?
answer: A deep breath helps our body slow down and feel calm. We breathe in through the nose, like smelling
  a flower. Then we breathe out through the mouth, like blowing a candle.
lets_try: Smell the flower, blow out the candle. Do it three times, slowly.
talk_about: How do you feel after you take deep breaths?
grown_up_corner: Slow breathing signals the body to relax. {Practice|Practise} calm breathing when your
  child is already calm, so it is easy to remember in hard moments. Try 'bunny breaths' or breathing with
  a soft toy on the tummy.
