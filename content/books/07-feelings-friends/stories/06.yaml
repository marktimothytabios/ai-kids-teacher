id: feelings-friends-06
question: Why am I scared of the dark?
answer: In the dark we cannot see well, so things can seem strange. Our imagination makes shadows look
  like monsters. A night light and a cuddle can help us feel safe.
lets_try: Turn on a flashlight in a dim room. See the shadows and find what makes them.
talk_about: What helps you feel safe at night?
grown_up_corner: Fear of the dark is normal and common around age 3. Do not dismiss it. A night light,
  a {favorite|favourite} toy, a calm routine and a quick check under the bed can all help.
