id: feelings-friends-04
question: Why do I feel angry?
answer: We feel angry when something seems unfair, or we cannot have what we want. Angry feels hot and
  loud, like a volcano. It is OK to feel angry, but it is not OK to hit or hurt.
lets_try: Stomp your feet like an angry elephant, then squeeze a pillow. Now take a big breath and let
  it go.
talk_about: What can you do with your hands when you feel angry?
grown_up_corner: 'Accept the feeling, limit the behavior: ''You are angry, and I won''t let you hit. You
  can stomp or squeeze.'' Offer safe outlets and talk about it when everyone is calm.'
