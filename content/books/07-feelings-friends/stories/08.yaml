id: feelings-friends-08
question: Why do I feel shy?
answer: Sometimes new people or places feel big. Our body gets quiet and wants to hide. It is OK to feel
  shy. We can take our time and say hello when we are ready.
lets_try: Hold your teddy and wave to someone new from behind a grown-up. Then give a little smile.
talk_about: What helps you when you feel shy?
grown_up_corner: Shyness is a temperament, not a flaw. Avoid labels like 'She's shy' in front of your
  child. Warm up slowly and give plenty of time.
