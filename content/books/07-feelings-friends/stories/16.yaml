id: feelings-friends-16
question: Why do we laugh?
answer: 'We laugh when something is funny or when we feel happy. Laughing makes our tummy wobble and our
  face smile. It is catching: when you laugh, other people laugh, too!'
lets_try: Make a silly noise or a funny face. Can you make your grown-up laugh?
talk_about: What is the funniest thing you remember?
grown_up_corner: Laughter lowers stress and helps children connect with others. Silly play, funny voices
  and peekaboo-type games are wonderful for bonding.
