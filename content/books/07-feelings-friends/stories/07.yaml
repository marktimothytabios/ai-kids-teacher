id: feelings-friends-07
question: Why do I feel worried when you say goodbye?
answer: Goodbyes can feel big because we love you so much. But goodbyes do not last forever. Grown-ups
  always come back to pick you up.
lets_try: 'Play a goodbye game: wave to your teddy, hide for one minute, then say ''I''m back!'''
talk_about: What can you do to feel better while we are apart?
grown_up_corner: 'Make goodbyes short and loving: a hug, a kiss, a wave, then go. Never sneak away. A
  little goodbye routine, such as a special wave, builds trust that you will return.'
