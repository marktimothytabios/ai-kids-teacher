id: feelings-friends-13
question: Why do I feel jealous?
answer: Jealous is when someone else has something we want, or gets more attention. It feels bad inside.
  We can say, 'I feel jealous', and ask for a hug or a turn.
lets_try: Name a friend and name something you like about them. Then say something good about yourself.
talk_about: What can you do when you feel jealous?
grown_up_corner: 'Jealousy is common, especially with a new sibling. Give each child one-to-one time,
  listen without scolding and name what you see: ''You want a turn, too.'''
