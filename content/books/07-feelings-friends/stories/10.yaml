id: feelings-friends-10
question: Why is it OK to make mistakes?
answer: Everybody makes mistakes, even grown-ups! When we try something new, it might not work the first
  time. Mistakes help our brains learn.
lets_try: Draw a wobbly line or a funny circle on purpose. Say, 'Oops! Let's try again.'
talk_about: What did you learn when something went wrong?
grown_up_corner: 'Respond to mistakes with calm and curiosity: ''Oops, the milk spilled. Let''s get a
  cloth.'' Share your own mistakes and what you learned.'
