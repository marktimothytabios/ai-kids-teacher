id: feelings-friends-11
question: Why do I get grumpy when I am tired?
answer: When our bodies are tired, little things feel big. We might cry or shout. Rest, a snack and a
  cuddle help us feel better.
lets_try: Lie down with your teddy, close your eyes and take three slow breaths.
talk_about: What does your body feel like when you are tired?
grown_up_corner: Tiredness and hunger are the top causes of toddler meltdowns. Look for early signs (rubbing
  eyes, yawning, clinginess) and plan quiet time before it gets too much.
