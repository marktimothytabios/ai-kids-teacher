id: feelings-friends-20
question: Why do my feelings change?
answer: Feelings are like the weather. Sometimes it is sunny, sometimes it is stormy, and then the sun
  comes back. No feeling stays forever.
lets_try: Look outside and say what the weather is. Then say how you feel. Can both change?
talk_about: How do you feel now? Is it the same as this morning?
grown_up_corner: Feelings rise and fall, and no feeling is bad. The weather picture helps children see
  that tough feelings pass. This is a good last story for talking about all the feelings we met.
