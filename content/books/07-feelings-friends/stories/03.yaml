id: feelings-friends-03
question: Why do I cry?
answer: Crying is how your body lets out big feelings, like sad, hurt or cross. Tears help you feel better,
  and they tell others you might need a cuddle. It's okay to cry.
lets_try: Make a sad face. Now a happy face! What helps you feel better?
talk_about: What helps you after a good cry?
grown_up_corner: Tears help the body release stress, and many children feel calmer after crying. Stay
  close and calm. Instead of 'Stop crying', try 'I see you are upset. I am here.'
