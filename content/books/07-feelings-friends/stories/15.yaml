id: feelings-friends-15
question: Why do we have friends?
answer: Friends play with us, laugh with us and help us. With a friend, we can share and take turns. Friends
  make life more fun!
lets_try: 'Play a game with a friend or a stuffed toy: ''Follow the leader''. Then swap who leads.'
talk_about: What do you like doing with your friends?
grown_up_corner: Toddlers often play beside each other rather than together, and that is normal. Short
  playdates with simple toys and a grown-up nearby help friendships begin.
