id: feelings-friends-12
question: Why do I feel bored?
answer: Bored feels like waiting with nothing to do. But boredom is a little nudge to make something new.
  We can build, draw, sing or look for something fun.
lets_try: Find five things you can use to play a new game. A spoon? A box? A sock puppet?
talk_about: What can you make when you feel bored?
grown_up_corner: A bit of boredom grows creativity. Offer open-ended things like boxes, blocks and art
  supplies rather than screens, and resist the urge to fill every minute.
