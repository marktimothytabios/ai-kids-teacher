id: feelings-friends-18
question: Why do I feel proud?
answer: We feel proud when we work hard and do something well. Proud feels big and bright, like a sunrise
  inside! You can feel proud even when it takes a few tries.
lets_try: Tell someone one thing that you are proud of. Then give yourself a big clap!
talk_about: What are you proud of today?
grown_up_corner: 'Notice effort: ''You kept trying and you did it!'' Focus on how the child feels (''You
  must be so proud'') rather than only on your own approval.'
