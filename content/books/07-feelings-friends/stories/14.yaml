id: feelings-friends-14
question: Why do I feel lonely?
answer: Lonely feels like having nobody close by. We all feel lonely sometimes. We can call a friend,
  hug someone or ask a friend to play.
lets_try: Draw a picture of someone you love. Then give it to them or hang it up.
talk_about: Who would you like to play with today?
grown_up_corner: Everyone feels lonely at times. Teach children to reach out with words and to notice
  when others are alone, and invite them in.
