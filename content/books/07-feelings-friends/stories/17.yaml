id: feelings-friends-17
question: Why do I feel so excited?
answer: Excited feels like bubbles in your tummy. It happens when something fun is going to happen, like
  a party. Our body wants to jump and wiggle!
lets_try: Jump up and down five times! Then take a deep breath and let your body settle.
talk_about: What are you excited about?
grown_up_corner: Excitement and nervousness feel alike in the body. Help your child name it and then wind
  down with some calm breathing. Give a heads-up before events so there are fewer surprises.
