id: feelings-friends-01
question: Why do I feel happy?
answer: Happy feelings bubble up when good things happen. We might feel happy when we play, hug or eat
  something yummy. Happy feels warm and smiley inside!
lets_try: Make your happiest face. Now show a happy dance! What makes you feel happy today?
talk_about: What makes you feel happy?
grown_up_corner: 'Naming feelings gives children words for what is going on inside. Point out happy moments
  as they happen: ''You are smiling. You seem so happy!'''
