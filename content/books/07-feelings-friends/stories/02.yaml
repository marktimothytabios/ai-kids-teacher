id: feelings-friends-02
question: Why do I feel sad?
answer: We feel sad when we miss something we love, or things do not go as we hoped. Sad feelings are
  normal. Everybody has them. They get smaller when someone listens and cuddles us.
lets_try: Make your saddest face. Then ask a grown-up for a cuddle. Does the sad feeling get smaller?
talk_about: What helps you when you feel sad?
grown_up_corner: Do not rush to fix sadness. Say, 'I am here. It is OK to feel sad.' Feelings pass faster
  when they are heard.
