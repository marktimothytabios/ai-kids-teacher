id: feelings-friends-19
question: Why do I have BIG feelings?
answer: Our bodies are small, but our feelings can be huge. Big feelings can come out in shouts or tears.
  A grown-up can help us calm down, and soon the big feeling gets smaller.
lets_try: Draw a big feeling as a scribble or a {color|colour}. Then draw it getting smaller.
talk_about: Where do you feel big feelings in your body?
grown_up_corner: 'Toddlers'' emotional brains grow faster than their ability to calm themselves. Your
  calm presence teaches calm. Connect first, then guide: ''I am here.'''
