id: kind-hearts-08
question: Why do we care for animals?
answer: Animals feel happy, sad, hungry and thirsty, just like us. They cannot ask for help with words.
  So we are gentle, we give them food and water, and we keep them safe.
lets_try: Look after a stuffed animal. Give it a snack, a drink and a {cozy|cosy} bed.
talk_about: How do you know if a pet is happy?
grown_up_corner: Caring for a pet or a plant builds empathy. Show gentle ways to touch and respect an
  animal's space. Always supervise, and teach children to ask first before petting.
