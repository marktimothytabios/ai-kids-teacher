id: kind-hearts-20
question: Why does my family love me?
answer: Because you are YOU! Your family loves you when you are happy, sad, silly or sleepy. Love doesn't
  stop - not ever, ever, ever.
lets_try: Give someone you love a great big cuddle!
talk_about: Who loves you? Who do you love?
grown_up_corner: 'Say it often and mean it: ''I love you when you are happy, and when you are sad.'' Secure
  love is the base from which children grow brave, kind and curious.'
