id: kind-hearts-14
question: Why do we not laugh when someone falls?
answer: When someone falls, they can feel hurt and embarrassed. Laughing can make them feel worse. We
  can ask, 'Are you OK?' and help them up.
lets_try: Pretend your teddy fell over. Say 'Are you OK?' and help it stand up.
talk_about: What can you say to a friend who fell?
grown_up_corner: Toddlers sometimes laugh at a fall because it looks funny or they feel nervous. Gently
  say, 'I see you laughed. He is hurt. Let's see if he's OK.'
