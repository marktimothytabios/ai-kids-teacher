id: kind-hearts-12
question: Why do we hold the door for others?
answer: Holding the door is a small kind thing. It helps someone who has full hands or is slow. When we
  hold the door, a stranger smiles and says thank you.
lets_try: Pretend to hold a door open for your teddy and your toys. Say 'After you!'
talk_about: Who might need help with a door?
grown_up_corner: 'Small kind acts, such as holding doors and giving up seats, teach consideration. Notice
  kindness in others, too: ''That man held the door. How kind!'''
