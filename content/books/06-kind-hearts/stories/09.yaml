id: kind-hearts-09
question: Why do we listen when someone is talking?
answer: When we listen, we hear what our friend is saying. It shows we care. Then our friend feels special,
  and they listen to us, too.
lets_try: Play 'I spy' or tell a friend a short story. Then say back one thing that they told you.
talk_about: What do we do with our eyes and ears when we listen?
grown_up_corner: Get down to your child's level and look at them when they talk, as a model for good listening.
  Listening is the foundation of friendship and learning.
