id: kind-hearts-03
question: Why do we share?
answer: Sharing means we both get to have fun. When we take turns, everyone gets a go, and we make friends.
  Sharing makes hearts happy!
lets_try: 'Take turns rolling a ball with someone: my turn, your turn!'
talk_about: What do you like to share the most?
grown_up_corner: Toddlers are just learning that things belong to people. Sharing becomes easier with
  practice, praise and turn-taking, such as 'when the sand timer is done, it is Ben's turn'. Special toys
  can be put away before a playdate.
