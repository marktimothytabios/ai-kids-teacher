id: kind-hearts-16
question: Why do we have friends who look different?
answer: People are not all the same. Some have curly hair and some have straight hair. Some are tall and
  some are small. We are different on the outside, and we all like to play and laugh.
lets_try: Draw a picture of you and your friends. Make each person look different.
talk_about: What do you like about your friend?
grown_up_corner: Notice and celebrate differences positively, from skin {color|colour} to abilities to
  families. Books, toys and dolls that reflect all kinds of people help children respect others.
