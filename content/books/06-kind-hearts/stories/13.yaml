id: kind-hearts-13
question: Why do we hug someone who is sad?
answer: When someone is sad, a hug can feel like a warm blanket. It tells them, 'I am here.' Even a kind
  word or a smile can help.
lets_try: 'Ask first: ''Would you like a hug?'' If yes, give a nice, gentle hug to a teddy or a person.'
talk_about: What helps you when you feel sad?
grown_up_corner: Teach children to ask 'Would you like a hug?' and to accept 'no'. Comfort can also be
  a drawing, a {favorite|favourite} toy or sitting quietly together.
