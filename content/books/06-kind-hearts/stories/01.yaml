id: kind-hearts-01
question: Why do we say please and thank you?
answer: Please and thank you are kind words. They show people that we care about them. Kind words make
  everyone feel happy!
lets_try: '{Practice|Practise}: ''Please may I have a cuddle?'' ... ''Thank you!'''
talk_about: Who did you say thank you to today?
grown_up_corner: 'Toddlers learn manners by hearing them. Say please and thank you to your child, too.
  Praise it when you notice it: ''That was kind. Thank you for asking nicely.'''
