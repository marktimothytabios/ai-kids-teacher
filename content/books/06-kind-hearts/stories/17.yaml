id: kind-hearts-17
question: Why do we clap for others?
answer: Clapping shows we are happy for someone. When a friend tries hard, we clap. It makes them feel
  proud and brave.
lets_try: Clap for your friend or family when they sing a song or do a trick!
talk_about: When did someone clap for you?
grown_up_corner: Praise effort, such as trying and {practicing|practising}, rather than only winning.
  'You worked hard on that' builds resilience and a growth mindset.
