id: kind-hearts-10
question: Why do we use an inside voice?
answer: Inside, loud sounds can hurt ears and wake the baby. A soft voice is calm and kind. Outside we
  can shout and play, and inside we speak softly.
lets_try: Whisper 'hello' like a mouse. Now say it in a normal voice. Now say it in a roaring outside
  voice!
talk_about: Where is it OK to shout and sing loudly?
grown_up_corner: Toddlers learn volume by contrast. Use visual cues such as 'mouse voice' and 'lion voice',
  and give them plenty of outdoor chances to be loud.
