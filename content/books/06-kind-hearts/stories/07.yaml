id: kind-hearts-07
question: Why do we use gentle hands?
answer: Gentle hands are soft and slow. Hard hands can hurt a friend, a baby or a pet. Gentle hands give
  pats, cuddles and high fives.
lets_try: Stroke a soft toy with gentle hands. Now stroke your own cheek. How does it feel?
talk_about: Who do we have to be extra gentle with?
grown_up_corner: Show 'gentle' by guiding your child's hand slowly. 'Gentle' is a word they can hold on
  to when playing with babies, pets and flowers.
