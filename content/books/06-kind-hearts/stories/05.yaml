id: kind-hearts-05
question: Why do we ask nicely instead of grabbing?
answer: When we grab, our friend feels cross or sad. When we ask, our friend can say yes. Asking nicely
  is kind, and it often gets us what we want!
lets_try: '{Practice|Practise} asking a teddy: ''Please may I have the ball?'' Then say ''Thank you!'''
talk_about: How does your friend feel if you grab?
grown_up_corner: 'Offer words to replace grabbing: ''Can I have a turn, please?'' If your child grabs,
  stay calm: return the toy, name the feeling, and show the words to use.'
