id: kind-hearts-15
question: Why do we invite others to play?
answer: It feels sad to be left out. When we say 'Come and play!' everyone has fun. More friends mean
  more games!
lets_try: Next time you see a child playing alone, say 'Do you want to play with me?'
talk_about: How can we include a new friend?
grown_up_corner: '{Practice|Practise} inviting words at home with toys. Praise your child when they include
  someone, and talk through how it felt to be left out.'
