id: kind-hearts-04
question: Why do we wait for our turn?
answer: Waiting can be hard, but everybody gets a go. When we wait, our friends feel happy and fair. And
  when it is our turn, they wait for us!
lets_try: Roll a ball back and forth with a friend. Say 'My turn, your turn!' each time.
talk_about: What can you do while you wait?
grown_up_corner: 'Waiting is hard for toddlers. Give them something to do while waiting, such as counting,
  singing or looking around. Praise waiting generously: ''You waited so patiently!'''
