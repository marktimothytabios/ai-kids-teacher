id: kind-hearts-06
question: Why do we say sorry?
answer: Sometimes we bump a friend or break a toy by accident. That can make them feel sad or hurt. Saying
  sorry shows we care, and it helps them feel better.
lets_try: Pretend to bump a teddy by accident. Say 'Sorry, teddy!' and give it a gentle pat.
talk_about: How do you feel when someone says sorry to you?
grown_up_corner: 'Toddlers say sorry best when they have seen the other child''s face. Name the feeling
  first: ''Ben is sad.'' Then offer a way to help, like a pat or a hug, and do not force an empty apology.'
