id: sky-weather-02
question: Why does the sun go away at night?
answer: The sun doesn't really go to sleep! Our Earth is always spinning, very slowly. When our side turns
  away from the sun, it gets dark and it is night-time. When we turn back around, the sun says good morning!
lets_try: 'Spin around slowly like the Earth. Now wave and say: ''Good night, sun!'''
talk_about: What do you like to do when the sun comes back in the morning?
grown_up_corner: The Earth spins once every 24 hours. It is day on the side facing the sun and night on
  the side facing away. Remind children never to look straight at the sun.
