id: sky-weather-09
question: Why does ice melt?
answer: Ice is water that got very, very cold and turned hard. When it gets warm, the ice turns back into
  water. That's called melting! Drip, drip, drip.
lets_try: Hold an ice cube with a grown-up. Is it cold? Put it in the sun and watch it melt!
