id: sky-weather-09
question: Why is there thunder?
answer: BOOM! Lightning is a big, bright spark in the clouds. It is so hot that it makes the air go BOOM!
  That boom is thunder. It is very loud, but we are safe and {cozy|cosy} inside our house.
lets_try: Make thunder! Clap a big loud BOOM, then a tiny quiet boom.
talk_about: What helps you feel safe when it is very loud?
grown_up_corner: Lightning heats the air so fast that it bursts outward, and we hear that as thunder.
  Light travels faster than sound, so we see the flash first. Calm cuddles help children who feel scared.
