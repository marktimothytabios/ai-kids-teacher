id: sky-weather-10
question: Why is snow cold?
answer: Snow is made in clouds that are very, very cold. Tiny bits of water freeze into pretty snowflakes.
  Every snowflake is a little bit different, just like you!
lets_try: Pretend to be a snowflake. Float down... down... down... to the floor.
