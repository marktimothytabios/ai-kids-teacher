id: sky-weather-06
question: Why do clouds move?
answer: Wind pushes the clouds across the sky. Strong winds high up make them travel far. Some clouds
  drift slowly. Some zoom along!
lets_try: Lie on your back and watch the clouds. Can you find one that looks like an animal?
talk_about: Which way are the clouds going today?
grown_up_corner: Clouds are made of tiny water drops or ice floating in the air. Winds high above us can
  be much faster than the breeze we feel on the ground.
