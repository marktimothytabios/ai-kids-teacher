id: sky-weather-12
question: Why do I have a shadow?
answer: When you stand in the sunshine, your body blocks some of the light. The dark shape on the ground
  where the light can't reach is your shadow. It copies everything you do!
lets_try: Go outside on a sunny day. Can you make your shadow wave?
