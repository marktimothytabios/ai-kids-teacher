id: sky-weather-12
question: Why do puddles disappear?
answer: The sun warms the water. Tiny bits of water float up into the air, where we cannot see them. The
  puddle gets smaller and smaller, and then it is gone!
lets_try: Paint a picture on the {sidewalk|pavement} with a wet brush. Watch it vanish in the sun!
talk_about: Where do you think the water went?
grown_up_corner: This is evaporation. Water turns into an invisible gas called water vapor and rises.
  Sunshine and wind make it happen faster.
