id: sky-weather-07
question: Why does it rain?
answer: Clouds are made of teeny tiny drops of water. When lots of drops squish together, they get too
  heavy to float. Then they fall down as rain! Plants and animals drink the rain.
lets_try: Pitter-patter! Tap your fingers on the table like rain. Now go fast like a big storm!
talk_about: What sound does rain make on the roof?
grown_up_corner: Water rises from seas, rivers and puddles, cools into clouds, then falls again as rain.
  This loop is called the water cycle.
