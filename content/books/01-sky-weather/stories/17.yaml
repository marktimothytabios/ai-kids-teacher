id: sky-weather-17
question: Why do we have seasons?
answer: The Earth is tilted a little as it travels around the sun. When our part leans toward the sun,
  we get summer. When it leans away, we get winter.
lets_try: Walk slowly in a big circle around a lamp, holding a ball like the Earth. See how the light
  changes!
talk_about: Which season do you like best?
grown_up_corner: Seasons come from the tilt of the Earth, not from being closer to the sun. When it is
  summer in the north, it is winter in the south.
