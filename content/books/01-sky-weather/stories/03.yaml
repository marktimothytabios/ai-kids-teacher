id: sky-weather-03
question: Why does the moon change shape?
answer: The moon is always round, like a ball. The sun shines on it, and we only see the bright part.
  As the moon goes around the Earth, we see a little bit or a lot. Sometimes it's a big circle, sometimes
  a thin smile!
lets_try: When it's dark, look for the moon with a grown-up. Is it round or thin tonight?
