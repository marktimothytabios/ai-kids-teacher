id: sky-weather-11
question: Why does the wind blow?
answer: Wind is air on the move! When the sun warms the air, the air moves around and pushes on things.
  We can't see wind, but we can see it wiggle the trees and blow our hair.
lets_try: Take a big breath and blow! Whoooosh - you made wind!
talk_about: What can the wind move? What stays still?
grown_up_corner: Wind is moving air. Some ground warms up faster than other ground, and the warm air rises
  while cooler air rushes in to take its place. Try a scarf, a kite or a feather in the breeze.
