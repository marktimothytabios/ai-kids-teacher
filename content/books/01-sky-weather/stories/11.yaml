id: sky-weather-11
question: Why do leaves fall off trees?
answer: Some trees take a rest when the weather gets cold. Their leaves turn red, orange and yellow, then
  float to the ground. In spring, new green leaves grow back!
lets_try: Collect some leaves. Which one is the biggest? Which one is the smallest?
