id: sky-weather-08
question: Why do we use an umbrella?
answer: Rain makes us wet and cold. An umbrella is a little roof you can carry. It keeps the rain off
  your head and shoulders.
lets_try: Hold a pretend umbrella over your teddy. Can you keep teddy dry?
talk_about: What else keeps us dry in the rain?
grown_up_corner: 'Umbrellas and raincoats are waterproof, so rain slides off instead of soaking in. A
  good moment to name the rain gear together: boots, coat, hat.'
