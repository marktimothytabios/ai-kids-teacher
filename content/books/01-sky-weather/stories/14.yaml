id: sky-weather-14
question: Why is snow cold?
answer: Snow is made in clouds that are very, very cold. Tiny bits of water freeze into pretty snowflakes.
  Every snowflake is a little bit different, just like you!
lets_try: Pretend to be a snowflake. Float down... down... down... to the floor.
talk_about: What would you build if you had lots of snow?
grown_up_corner: Snow forms when water vapor freezes into tiny ice crystals high in the clouds. Snow feels
  cold because it takes heat from our warm hands. If you live somewhere warm, try crushed ice.
