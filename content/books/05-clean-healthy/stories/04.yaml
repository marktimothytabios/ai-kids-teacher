id: clean-healthy-04
question: Why do we wash our hands after the toilet?
answer: The toilet is where our body gets rid of the stuff it does not need. This has germs, even if we
  cannot see them. Soap and water wash them away, so our hands are clean to eat and play.
lets_try: 'Sing a little song while you scrub with soap: ''Wash, wash, wash my hands, then they will be
  clean!'''
talk_about: What happens if we do not wash our hands?
grown_up_corner: Handwashing after the toilet is one of the best ways to stop tummy bugs from spreading.
  Keep a stool at the sink so little ones can do it themselves.
