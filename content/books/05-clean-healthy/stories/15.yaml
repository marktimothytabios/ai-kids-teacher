id: clean-healthy-15
question: Why do we eat breakfast?
answer: While we sleep, our body uses up its energy. Breakfast fills the tank again. Then we have energy
  to play, learn and grow.
lets_try: 'Help set out a healthy breakfast: bread, fruit, milk. How many things can you name?'
talk_about: What is your {favorite|favourite} breakfast?
grown_up_corner: A breakfast with some protein, fruit and whole grain keeps children going until lunch.
  Let your child choose between two healthy options to build ownership.
