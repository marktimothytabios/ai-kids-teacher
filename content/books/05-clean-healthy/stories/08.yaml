id: clean-healthy-08
question: Why do we cut our nails?
answer: Nails keep growing and growing. If they get long, dirt hides underneath and they can scratch.
  So a grown-up trims them to keep them short and clean.
lets_try: Look at your fingernails. Are they clean? Can you pick up a button with them?
talk_about: Who helps you keep your nails short?
grown_up_corner: Trim fingernails straight across, with child nail scissors or clippers, when your child
  is calm. A little cuddle after trimming makes it a positive routine.
