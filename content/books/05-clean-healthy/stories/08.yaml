question: Why do we wear a hat in the sun?
answer: 'The sun is warm and bright, but too much sun can burn our skin. A hat shades our face, neck and
  ears. Slip, slop, slap: a shirt, sunscreen and a hat!'
lets_try: Put on your hat! Now, can you find some shade?
