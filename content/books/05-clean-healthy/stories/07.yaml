id: clean-healthy-07
question: Why do we brush our teeth?
answer: Tiny germs love to eat the bits of food left on our teeth. Brushing sweeps the germs away, so
  our teeth stay clean, strong and shiny. Brush in the morning and at night!
lets_try: 'Show me your big smile! Now pretend to brush: scrub, scrub, scrub.'
talk_about: What is your {favorite|favourite} toothpaste {flavor|flavour}? What do you do after brushing?
grown_up_corner: Brush twice a day for two minutes, in small circles, including the back teeth and tongue.
  Use a smear of fluoride toothpaste for toddlers, and let your child 'have a turn', then you finish.
