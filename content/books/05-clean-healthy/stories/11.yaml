id: clean-healthy-11
question: Why do we wear a hat in the sun?
answer: 'The sun is warm and bright, but too much sun can burn our skin. A hat shades our face, neck and
  ears. Slip, slop, slap: a shirt, sunscreen and a hat!'
lets_try: Put on your hat! Now, can you find some shade?
talk_about: What other things protect us from the sun?
grown_up_corner: The sun's rays can burn skin quickly, even on cloudy days. Hats, light clothes, shade
  and sunscreen all help. Reapply sunscreen every two hours, and try to avoid the middle of the day.
