question: Why do we need to sleep?
answer: z z z Sleep is when your body rests and grows. Your brain tidies up all the things you learned
  today. When you wake up, you have lots of energy to play again!
lets_try: Lie down and close your eyes. Can you be as still as a sleeping cat?
talk_about: What helps you fall asleep?
grown_up_corner: Toddlers need around 11 to 14 hours of sleep in 24 hours, including naps. A regular,
  calm bedtime routine with a bath, a book and a cuddle helps children settle.
