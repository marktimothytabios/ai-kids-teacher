id: clean-healthy-03
question: Why do we wash our hands?
answer: Our hands touch lots of things and pick up tiny germs we can't see. Soap and water wash the germs
  away, so they don't make us sick. Scrub, rinse, dry!
lets_try: Wash your hands and sing 'Happy Birthday' two times.
