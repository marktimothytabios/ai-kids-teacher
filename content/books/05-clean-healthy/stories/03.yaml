id: clean-healthy-03
question: Why do we wipe our nose?
answer: Our nose makes sticky mucus to catch dust and germs. When we have a cold, there is lots of it.
  A tissue wipes it away, then we throw the tissue in the {trash|bin}.
lets_try: Pick up a tissue. Wipe your nose gently, put the tissue in the {trash|bin}, and wash your hands.
talk_about: What do we do after we use a tissue?
grown_up_corner: Teach gentle blowing, one side at a time. Wash hands afterward. Dry, cracked skin around
  the nose can be soothed with a little {moisturizer|moisturiser}.
