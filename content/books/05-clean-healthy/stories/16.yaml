id: clean-healthy-16
question: Why do we need to move and play?
answer: Running, jumping and dancing make our muscles and our heart strong. They help us sleep well and
  feel happy. Moving is good for our bodies and our brains!
lets_try: Dance to your {favorite|favourite} song for one whole minute. Jump, spin, stop. Freeze!
talk_about: What is your {favorite|favourite} way to move?
grown_up_corner: Toddlers need at least three hours of movement a day, and it can be spread across the
  day. Outdoor play is the best, and you can join in too.
