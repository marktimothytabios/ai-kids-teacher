id: clean-healthy-02
question: Why do we cover our cough?
answer: When we cough, tiny drops fly out of our mouth. They can carry germs to other people. So we cough
  into our elbow, and that keeps our friends healthy.
lets_try: '{Practice|Practise} a ''vampire cough'' into the bend of your elbow. Then wash your hands!'
talk_about: Who do we keep healthy when we cover our cough?
grown_up_corner: An elbow cough is better than a hand cough because the elbow does not touch things. If
  a child uses a tissue, show them how to throw it away and wash hands.
