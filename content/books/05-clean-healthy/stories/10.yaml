id: clean-healthy-10
question: Why do we wear shoes?
answer: Shoes protect our feet from sharp, hot or yucky things on the ground. They help us walk, run and
  jump without getting owies.
lets_try: Can you find your shoes? Which one goes on which foot?
talk_about: What shoes do you wear on a rainy day?
grown_up_corner: Shoes protect against heat, sharp things and cold. Check that your child's shoes fit
  well, with room to wiggle toes. Barefoot time at home and on grass is also great for developing feet.
