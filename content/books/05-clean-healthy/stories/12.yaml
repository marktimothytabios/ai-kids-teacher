id: clean-healthy-12
question: Why do we eat vegetables?
answer: Vegetables are full of good things that help your body grow. Carrots, peas and broccoli help you
  be strong and healthy. Eating lots of {colors|colours} is good for you!
lets_try: Can you name a vegetable that is orange? Green? Red?
talk_about: Which vegetable is your {favorite|favourite}? What {color|colour} is it?
grown_up_corner: Vegetables give us vitamins, minerals and {fiber|fibre}. Offering a new vegetable many
  times, without pressure, helps children accept it. Eat together and let them see you enjoying them.
