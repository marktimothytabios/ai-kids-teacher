id: clean-healthy-14
question: Why do we drink water?
answer: Your body is full of water. When you run and play, you use some up and get thirsty. Drinking water
  fills you back up so you feel good.
lets_try: Have a big drink of water. Glug, glug, ahhh!
talk_about: When do you feel thirsty?
grown_up_corner: Children need regular drinks, especially when it is hot or they are active. Water is
  the best drink for thirst and teeth. Offer a cup at the table and carry a bottle on trips.
