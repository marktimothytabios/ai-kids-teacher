id: clean-healthy-05
question: Why do we have baths?
answer: We run and play and get messy all day! A bath washes off the dirt and germs, so our skin stays
  clean and healthy. And bubbles are fun!
lets_try: 'Name the body parts you wash: toes, knees, tummy, arms...'
talk_about: What is your {favorite|favourite} thing about bath time?
grown_up_corner: Children do not need a bath every day, but regular washing is good, especially after
  muddy play. A calm bath routine can also help signal that bedtime is coming. Never leave a young child
  alone in the bath, even for a moment.
