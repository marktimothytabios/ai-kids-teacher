id: my-body-15
question: Why does my heart go thump-thump?
answer: Your heart is a strong muscle inside your chest. It pumps blood all around your body, all day
  and all night. Put your hand on your chest and feel it go thump-thump!
lets_try: Jump 10 times, then feel your heart. Is it going faster?
talk_about: Can you find your heartbeat? Put your hand on your chest.
grown_up_corner: The heart pumps blood to every part of the body about 100,000 times a day. After running,
  the heart beats faster to bring more oxygen to our muscles, then slows down when we rest.
