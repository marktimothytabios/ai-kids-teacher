id: my-body-20
question: Why do I have a belly button?
answer: Before you were born, you grew inside {Mommy's|Mummy's} tummy. A special tube gave you food while
  you were in there. When you were born, you didn't need it any more, and your belly button is where it
  was!
lets_try: Can you find your belly button? Can you find Teddy's?
talk_about: Where is your belly button? Can you find your friend's?
grown_up_corner: 'The belly button is the scar where the umbilical cord was attached. Everyone has one,
  and it can be an inny or an outy. Explain it gently: it''s where we were once connected to our mother
  before we were born.'
