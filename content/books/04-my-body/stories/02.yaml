id: my-body-02
question: Why do we have two eyes?
answer: Two eyes help you see how near or far away things are. Each eye sees a little bit differently,
  and your brain puts the pictures together. That helps you catch a ball!
lets_try: Close one eye, then the other. Does the picture jump?
talk_about: What can you see when you close one eye?
grown_up_corner: Our two eyes see slightly different pictures, and the brain puts them together. This
  helps us judge how far away things are. Try catching a ball with one eye covered, then both.
