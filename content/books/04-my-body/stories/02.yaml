id: my-body-02
question: Why do I have a belly button?
answer: Before you were born, you grew inside {Mommy's|Mummy's} tummy. A special tube gave you food while
  you were in there. When you were born, you didn't need it any more, and your belly button is where it
  was!
lets_try: Can you find your belly button? Can you find Teddy's?
