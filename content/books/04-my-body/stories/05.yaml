id: my-body-05
question: Why do I sneeze?
answer: ACHOO! Sometimes dust or tiny things tickle inside your nose. Your body pushes them out with a
  big ACHOO! Remember to sneeze into your elbow.
lets_try: 'Pretend to sneeze into your elbow: ah... ah... ACHOO!'
