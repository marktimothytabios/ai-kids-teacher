id: my-body-05
question: Why do I have a nose?
answer: Your nose helps you smell flowers, food and more. It also warms the air you breathe in. It is
  a little air door that helps you breathe!
lets_try: Smell a banana, a flower or a bit of toast. Which one smells best? Hold your nose and smell
  again.
talk_about: What is your {favorite|favourite} smell?
grown_up_corner: Our nose has tiny hairs and sticky mucus to catch dust and germs. Smell and taste work
  together, which is why food tastes dull when we have a cold.
