id: my-body-07
question: Why do I have a tongue?
answer: Your tongue helps you taste sweet, sour and salty things. It also helps you talk and move your
  food around. It is strong and wiggly!
lets_try: Stick out your tongue and wiggle it up, down and side to side. Then say 'La la la!'
talk_about: What is the yummiest thing you ever tasted?
grown_up_corner: The little bumps on the tongue hold taste buds. A tongue is a strong muscle. Taste helps
  us tell safe food from spoiled food. Let your child try new foods without pressure.
