id: my-body-03
question: Why do I blink?
answer: Blinking wipes your eyes clean and wet. Your eyelids close and open very fast, again and again.
  You do it all by yourself, without thinking!
lets_try: Look at a friend and blink slowly. How many blinks can you do in a minute?
talk_about: When do your eyes feel dry or tired?
grown_up_corner: We blink about 15 to 20 times a minute, less when we stare at a screen, so keep screens
  low. Each blink spreads a thin layer of tears over the eye to protect it.
