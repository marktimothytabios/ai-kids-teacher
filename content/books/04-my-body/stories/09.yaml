id: my-body-09
question: Why do I have a brain?
answer: Your brain is the boss of your body. It helps you think, remember, dream and learn new things.
  It tells your legs to run and your mouth to smile.
lets_try: Pat your head and rub your tummy at the same time. Your brain is working hard!
talk_about: What did you learn today?
grown_up_corner: 'The brain grows fastest in the first years of life, and it grows by being used: playing,
  talking and exploring. Sleep, food and cuddles help it grow, too.'
