id: my-body-19
question: Why do I grow bigger?
answer: Every day, your body is busy building. Good food, sleep and play help your bones and muscles grow.
  Every birthday, you're a little bit taller!
lets_try: Stand by the wall. How tall are you? Ask a grown-up to mark it!
talk_about: What can you do now that you could not do when you were a baby?
grown_up_corner: Children grow in bursts, mostly while they sleep. Look at old photos and baby clothes
  together. This is lovely for talking about growing up and being proud.
