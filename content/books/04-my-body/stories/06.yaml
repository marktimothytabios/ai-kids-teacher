id: my-body-06
question: Why do I sneeze?
answer: ACHOO! Sometimes dust or tiny things tickle inside your nose. Your body pushes them out with a
  big ACHOO! Remember to sneeze into your elbow.
lets_try: 'Pretend to sneeze into your elbow: ah... ah... ACHOO!'
talk_about: What do we say after someone sneezes?
grown_up_corner: A sneeze is a quick blast of air that clears the nose. It can travel far and spread germs,
  so teach sneezing into an elbow or a tissue and washing hands afterward.
