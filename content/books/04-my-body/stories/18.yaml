id: my-body-18
question: Why do we yawn?
answer: We yawn when we're tired or sleepy. A great big yawn brings lots of fresh air into our body. And
  guess what? Yawns are catchy! When you see someone yawn, you might yawn too.
lets_try: Do a great big yawn and a stretch! Did a grown-up yawn too?
talk_about: What do you do after you yawn?
grown_up_corner: Nobody is sure why we yawn, but it often means we are tired or bored, and yawns are catching!
  Yawning is a sign that a calm bedtime routine might be near.
