id: my-body-16
question: Why does my tummy rumble?
answer: Your tummy squishes and squeezes your food to help your body use it. When your tummy is empty,
  the air and juices inside gurgle and rumble. It might be saying 'Snack time, please!'
lets_try: Pat your tummy. Can you make a rumbly sound? Grrrrr!
talk_about: What does your tummy say when you are hungry?
grown_up_corner: The tummy and gut squeeze food along, and the gurgling is gas and liquid moving. A rumble
  does not always mean hunger, but it is a good moment to talk about food, drink and eating together.
