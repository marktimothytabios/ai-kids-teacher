id: my-body-04
question: Why do we have ears?
answer: Ears catch sounds and send them to your brain. That's how you hear music, birds singing, and people
  saying 'I love you'. Ears even help you balance!
lets_try: Close your eyes and listen. What sounds can you hear?
talk_about: What is your {favorite|favourite} sound? What sound do you not like?
grown_up_corner: Sound waves make the eardrum shake, and tiny bones pass the shake along to the brain.
  Remind children that loud noises can hurt their ears, so ask them to cover their ears for very loud
  sounds.
