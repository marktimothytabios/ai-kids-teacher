question: Why do I get hiccups?
answer: hic! hic! There's a muscle under your chest that helps you breathe. Sometimes it jumps all by
  itself. Then air rushes in with a 'hic!' Hiccups are silly, and they always go away.
lets_try: 'Breathe slowly: smell the flower, then blow out the candle. In... and out.'
talk_about: What makes your hiccups go away?
grown_up_corner: A hiccup happens when the muscle under the lungs (the diaphragm) jumps and the voice
  box snaps shut. Hiccups are harmless and normally pass in a few minutes. Sipping water can help.
